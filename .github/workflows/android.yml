name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer Docker
      run: |
        export BUILDOZER_ALLOW_INSTALL_AS_ROOT=1
        docker run --rm -v ${{ github.workspace }}:/workdir -w /workdir kivy/buildozer:latest android debug > build_log.txt 2>&1 || (cat build_log.txt && exit 1)

    - name: Upload APK or Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-output
        path: |
          bin/*.apk
          build_log.txt
          
