name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer
      uses: ArtemSydoryk/buildozer-action@v1.2
      with:
        command: buildozer android debug
        buildozer_version: master
        
